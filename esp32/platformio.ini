; Hoermann SupraMatic BLE -> MQTT bridge, Seeed XIAO ESP32-C3.
; Registers its own root key on the gate once (RSA, via the gate's QR-code
; public key), then signs BLE commands (HMAC-SHA256) exactly like the real
; BlueSecur app does - protocol reverse engineered from the app's own
; decompiled C# (SAL.BlueConnect.IO.Signed / .Encrypted).

[env:seeed_xiao_esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32c3
framework = arduino

monitor_speed = 115200
; XIAO C3 flashes/logs over its native USB-C; COM port auto-detected.

extra_scripts = pre:gen_secrets.py

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    knolleary/PubSubClient@^2.8
